<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HungerStation ID Card Generator</title>
  <!-- Cropper CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #1e1e1e;
      color: #fff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      justify-content: center;
      max-width: 950px;
      width: 100%;
    }

    .form-box {
      background: #2d2d2d;
      padding: 20px;
      border-radius: 12px;
      flex: 1;
      min-width: 320px;
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;}
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #3a3a3a;
      color: #fff;
      font-size: 14px;
    }

    .crop-modal {
      display: none;
      margin-top: 10px;
      background: #111;
      padding: 10px;
      border-radius: 8px;
    }
    .img-container {
      max-height: 250px;
      width: 100%;
    }
    .crop-btn {
      margin-top: 10px;
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    /* কার্ডের পারফেক্ট সাইজ ও শেইপ */
    .preview-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #id-card {
      width: 320px;
      height: 520px;
      background-color: #FBC02D;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .photo-frame {
      width: 210px;
      height: 250px;
      margin: 25px auto 15px auto;
      border: 4px solid #1A0D00;
      border-radius: 22px;
      overflow: hidden;
      background: #fff;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info-group {
      padding: 0 25px;
      font-size: 16px;
      font-weight: bold;
    }

    .info-row {
      display: flex;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .info-label {
      color: #0088E8;
      width: 95px;
      flex-shrink: 0;
    }

    .info-val {
      color: #000;
      word-break: break-word;
    }

    .card-footer {
      background-color: #0088E8;
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 12px 0;
      text-align: center;
      border-top-left-radius: 50% 20px;
      border-top-right-radius: 50% 20px;
    }

    .card-footer span {
      display: block;
      color: #fff;
      font-weight: 900;
      line-height: 0.95;
    }
    .title-top { font-size: 30px; }
    .title-bottom { font-size: 30px; }

    .download-btn {
      margin-top: 15px;
      background: #0088E8;
      color: #fff;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      width: 320px;
    }
  </style>
</head>
<body>

<div class="main-container">
  <!-- ইনপুট ও ক্রপ সেকশন -->
  <div class="form-box">
    <h3>Hunger Station Rider ID Card Generator</h3>
    
    <div class="form-group">
      <label>ফটো সিলেক্ট করুন-Select Your Photo:</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="crop-modal" id="cropModal">
      <div class="img-container">
        <img id="cropImage" src="">
      </div>
      <button class="crop-btn" onclick="applyCrop()">Apply Photo Alignment</button>
    </div>

    <div class="form-group" style="margin-top:15px;">
      <label>নাম (Name):</label>
      <input type="text" id="inputName" value="HUNGER STATION RIDER" oninput="renderCard()">
    </div>
    <div class="form-group">
      <label>মোবাইল নম্বর (Mobile):</label>
      <input type="text" id="inputMobile" value="0500000000" oninput="renderCard()">
    </div>
    <div class="form-group">
      <label>আইডি নম্বর (ID Number):</label>
      <input type="text" id="inputID" value="1234567890" oninput="renderCard()">
    </div>
  </div>

  <!-- কার্ড প্রিভিউ -->
  <div class="preview-box">
    <div id="id-card">
      <div class="photo-frame">
        <img id="cardPhoto" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg7OhkqXMtSU16FUi0nliXLTwUlB1B9mH3Q6nFrSIMX3BPvr4j5y2Sx0t-zJipHtEFu0s-AVzBAimE2e-U6iEQRG6iUCz2zaAzWUTPgV3B_0Xq-TjjsIK47UZpOXcpzd5MoK9c9J4g6m6WEoIpHeNd4wFNzRcRAwWtLAnJISp8xTug44wle7ZPIfYD8BXDp/s1600/1000087803.jpg" alt="Rider Photo">
      </div>
      <div class="info-group">
        <div class="info-row">
          <span class="info-label">Name:</span>
          <span class="info-val" id="valName">HUNGER STATION RIDER</span>
        </div>
        <div class="info-row">
          <span class="info-label">Mobile:</span>
          <span class="info-val" id="valMobile">0500000000</span>
        </div>
        <div class="info-row">
          <span class="info-label">ID Number:</span>
          <span class="info-val" id="valID">123456789</span>
        </div>
      </div>
      <div class="card-footer">
        <span class="title-top">HUNGER</span>
        <span class="title-bottom">STATION</span>
      </div>
    </div>
    <button class="download-btn" onclick="downloadCard()">Download Card Image</button>
  </div>
</div>

<script>
  let cropper;
  const imageInput = document.getElementById('imageInput');
  const cropImage = document.getElementById('cropImage');
  const cropModal = document.getElementById('cropModal');
  const cardPhoto = document.getElementById('cardPhoto');

  imageInput.addEventListener('change', function(e) {
    const files = e.target.files;
    if (files && files.length > 0) {
      const reader = new FileReader();
      reader.onload = function(event) {
        cropImage.src = event.target.result;
        cropModal.style.display = 'block';
        if (cropper) cropper.destroy();
        cropper = new Cropper(cropImage, {
          aspectRatio: 210 / 250,
          viewMode: 1,
          autoCropArea: 1,
        });
      };
      reader.readAsDataURL(files[0]);
    }
  });

  function applyCrop() {
    if (cropper) {
      const canvas = cropper.getCroppedCanvas({
        width: 420,
        height: 500
      });
      cardPhoto.src = canvas.toDataURL('image/png');
      cropModal.style.display = 'none';
    }
  }

  function renderCard() {
    document.getElementById('valName').innerText = document.getElementById('inputName').value;
    document.getElementById('valMobile').innerText = document.getElementById('inputMobile').value;
    document.getElementById('valID').innerText = document.getElementById('inputID').value;
  }

  function downloadCard() {
    const card = document.getElementById('id-card');
    html2canvas(card, {
      scale: 3, // হাই-রেজুলেশনের জন্য
      useCORS: true
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'HungerStation_ID_Card.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }
</script>
</body>
</html>
